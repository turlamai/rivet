name: Embedded Roundtrip

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-roundtrip-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-roundtrip:
    name: Linux embedded Racket round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up embeddable Racket CS
        uses: ./.github/actions/setup-embed-racket
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Install Linux development files
        run: |
          bash .github/scripts/apt-retry.sh --sudo update
          bash .github/scripts/apt-retry.sh --sudo install --yes --no-install-recommends \
            desktop-file-utils libglib2.0-dev libsecret-1-dev libgtk-4-dev weston xwayland
      - name: Build backend and integration runner
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rivet-linux-roundtrip"
          native_build="$RUNNER_TEMP/rivet-linux-native-integration"
          mkdir -p "$stage/res" "$stage/runtime"

          raco ctool \
            --runtime "$stage/runtime" \
            --runtime-access runtime \
            --mods "$stage/res/core.zo" \
            platform/linux/Integration/backend.rkt

          cp "$RIVET_RACKET_BOOT_DIR/petite.boot" "$stage/runtime/petite.boot"
          cp "$RIVET_RACKET_BOOT_DIR/scheme.boot" "$stage/runtime/scheme.boot"
          cp "$RIVET_RACKET_BOOT_DIR/racket.boot" "$stage/runtime/racket.boot"

          cmake -S platform/linux/Integration -B "$native_build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DRIVET_ROOT="$GITHUB_WORKSPACE" \
            -DRIVET_RACKET_INCLUDE="$RIVET_RACKET_INCLUDE" \
            -DRIVET_RACKET_LIBRARY="$RIVET_RACKET_LIBRARY"
          cmake --build "$native_build" --config Release
          "$native_build/RivetThemeTest"
          dbus-run-session -- "$native_build/RivetGlobalShortcutsTest"
          "$native_build/RivetUpdateHandoffTest"
          cp "$native_build/RivetIntegration" "$stage/RivetIntegration"
          chmod +x "$stage/RivetIntegration"

          echo "RIVET_LINUX_ROUNDTRIP_STAGE=$stage" >> "$GITHUB_ENV"
          echo "RIVET_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_BOOT_DIR=$stage/runtime" >> "$GITHUB_ENV"
      - name: Exercise embedded runtime
        timeout-minutes: 2
        run: "$RIVET_LINUX_ROUNDTRIP_STAGE/RivetIntegration"
      - name: Exercise Linux system adapter
        timeout-minutes: 2
        # Notification and Secret Service checks skip themselves on a runner
        # without a session bus; single-instance, autostart, and the crash
        # hook always run.
        run: '"$RIVET_LINUX_ROUNDTRIP_STAGE/RivetIntegration" --system ci ci'
      - name: Exercise Linux graceful shutdown hook
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/rivet-shutdown-marker"
          ready="$RUNNER_TEMP/rivet-shutdown-ready"
          rm -f "$marker" "$ready"
          "$RIVET_LINUX_ROUNDTRIP_STAGE/RivetIntegration" \
            --shutdown-probe "$marker" >"$ready" &
          probe_pid=$!
          for _ in $(seq 1 100); do
            grep -qx ready "$ready" 2>/dev/null && break
            kill -0 "$probe_pid" 2>/dev/null || {
              wait "$probe_pid"
              exit 1
            }
            sleep 0.05
          done
          grep -qx ready "$ready"
          kill -0 "$probe_pid"
          kill -TERM "$probe_pid"
          for _ in $(seq 1 100); do
            kill -0 "$probe_pid" 2>/dev/null || break
            sleep 0.05
          done
          if kill -0 "$probe_pid" 2>/dev/null; then
            kill -KILL "$probe_pid"
            wait "$probe_pid" || true
            echo "shutdown hook did not terminate the process" >&2
            exit 1
          fi
          wait "$probe_pid"
          grep -qx shutdown "$marker"
      - name: Build, package, and verify a generated GTK4 app
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cd "$root"
          raco rivet doctor
          raco rivet new Smoke
          cd Smoke
          mkdir -p assets/nested
          printf %s packaged-resource > assets/nested/product.txt
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace(
              '(resources . ())',
              '(resources . ("assets")) (linux-formats . ("deb"))')
          if updated == original:
              raise SystemExit("failed to configure Linux smoke resource")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet build
          test -x .rivet/stage/RivetHost
          test "$(cat .rivet/stage/app/assets/nested/product.txt)" = packaged-resource
          grep -Fq 'rivet::linux_runtime::Backend' linux/GeneratedBackend.hpp

          # Wayland is Rivet's primary Linux display target. A headless Weston
          # session plus GDK_BACKEND=wayland proves the packaged GTK host opens
          # through the native Wayland backend instead of X11 or XWayland.
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/rivet-wayland-runtime"
          export WAYLAND_DISPLAY=wayland-rivet-ci
          export GDK_BACKEND=wayland
          unset DISPLAY
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston_log="$RUNNER_TEMP/rivet-weston.log"
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 \
            --log="$weston_log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || {
              cat "$weston_log"
              wait "$weston_pid"
              exit 1
            }
            sleep 0.05
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || {
            cat "$weston_log"
            echo "headless Wayland compositor did not become ready" >&2
            exit 1
          }
          raco rivet package
          raco rivet verify
          test -x dist/Smoke-linux-x64/RivetHost
          test "$(cat dist/Smoke-linux-x64/app/assets/nested/product.txt)" = packaged-resource
          racket -e '
            (require rivet-cli/deb rivet-cli/project)
            (define project (load-project (current-directory)))
            (create-deb! project
                         (project-path project "dist" "Smoke-linux-x64"))'
          initial_deb="$(find dist -maxdepth 1 -type f -name 'Smoke-0.1.0-linux-*.deb' -print -quit)"
          test -n "$initial_deb"
          python3 - <<'PY'
          from pathlib import Path
          config = Path("rivet.rktd")
          text = config.read_text(encoding="utf-8")
          text = text.replace('(version . "0.1.0")', '(version . "0.1.1")')
          text = text.replace('(build . 1)', '(build . 2)')
          if '(version . "0.1.1")' not in text or '(build . 2)' not in text:
              raise SystemExit("failed to configure the upgrade version")
          config.write_text(text, encoding="utf-8")
          Path("assets/nested/product.txt").write_text(
              "upgraded-resource", encoding="utf-8")
          PY
          raco rivet package
          racket -e '
            (require rivet-cli/deb rivet-cli/project)
            (define project (load-project (current-directory)))
            (create-deb! project
                         (project-path project "dist" "Smoke-linux-x64"))'
          upgrade_deb="$(find dist -maxdepth 1 -type f -name 'Smoke-0.1.1-linux-*.deb' -print -quit)"
          test -n "$upgrade_deb"
          bash "$GITHUB_WORKSPACE/.github/scripts/smoke-linux-deb-install.sh" \
            "$initial_deb" "$upgrade_deb" smoke Smoke RivetHost 0.1.0-1 0.1.1-2
      - name: Upload Linux install diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deb-install-diagnostics
          path: |
            ${{ runner.temp }}/rivet-linux-deb-diagnostics
            ${{ runner.temp }}/rivet-weston.log
          if-no-files-found: warn
      - name: Build and verify the maintained GTK4 reference app
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/examples/taskboard"
          raco rivet schema check rivet-schema.json --json
          raco rivet package
          raco rivet verify
          test -x dist/rivet-taskboard-linux-x64/RivetHost
          test -f dist/rivet-taskboard-linux-x64/app/assets/sample-tasks.rktd
          raco rivet clean

  macos-roundtrip:
    name: macOS embedded Racket round trip
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Build backend and integration runner
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rivet-roundtrip"
          framework_dir="$stage/Frameworks"
          mkdir -p "$stage/res" "$stage/runtime" "$framework_dir"

          raco ctool \
            --runtime "$stage/runtime" \
            --runtime-access runtime \
            --mods "$stage/res/core.zo" \
            platform/macos/Integration/backend.rkt

          petite_source="$(find /Applications/Racket -name petite.boot -type f | head -n 1)"
          scheme_source="$(find /Applications/Racket -name scheme.boot -type f | head -n 1)"
          racket_boot_source="$(find /Applications/Racket -name racket.boot -type f | head -n 1)"
          test -n "$petite_source"
          test -n "$scheme_source"
          test -n "$racket_boot_source"
          cp "$petite_source" "$stage/runtime/petite.boot"
          cp "$scheme_source" "$stage/runtime/scheme.boot"
          cp "$racket_boot_source" "$stage/runtime/racket.boot"

          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          racket_lib="$(racket -e '(require setup/dirs) (display (path->string (find-lib-dir)))')"
          source_framework="$racket_lib/Racket.framework"
          test -d "$source_framework"
          ditto "$source_framework" "$framework_dir/Racket.framework"

          versions="$framework_dir/Racket.framework/Versions"
          version_path="$(find "$versions" -mindepth 1 -maxdepth 1 -type d -name '*_CS' | head -n 1)"
          test -n "$version_path"
          version_name="$(basename "$version_path")"
          ln -sfn "$version_name" "$versions/Current"
          ln -sfn "Versions/Current/Racket" "$framework_dir/Racket.framework/Racket"
          install_name_tool -id \
            "@rpath/Racket.framework/Versions/$version_name/Racket" \
            "$version_path/Racket"

          export RIVET_ROOT="$GITHUB_WORKSPACE"
          export RIVET_RACKET_FRAMEWORK_DIR="$framework_dir"
          swift build \
            --package-path platform/macos/Integration \
            --scratch-path "$RUNNER_TEMP/rivet-swift-integration" \
            -c release \
            -Xcc "-I${racket_include}" \
            -Xlinker -rpath \
            -Xlinker "@executable_path/Frameworks"

          swift_bin="$(swift build \
            --package-path platform/macos/Integration \
            --scratch-path "$RUNNER_TEMP/rivet-swift-integration" \
            -c release --show-bin-path)"
          cp "$swift_bin/RivetIntegration" "$stage/RivetIntegration"
          chmod +x "$stage/RivetIntegration"

          echo "RIVET_ROUNDTRIP_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Exercise embedded runtime
        timeout-minutes: 2
        run: "$RIVET_ROUNDTRIP_STAGE/RivetIntegration"
      - name: Exercise embedded runtime under hardened signing (issue #358)
        timeout-minutes: 2
        run: |
          # Re-sign the integration runner and the embedded Racket dylib
          # with the hardened runtime. The runner gets the dev overlay
          # (declared channel keys plus the ad-hoc library-validation
          # exemption). This stage's Racket.framework is hand-assembled
          # (ditto + symlink repair) rather than a packaged bundle, so
          # codesign cannot seal the wrapper; the Mach-O dylib signature is
          # what AMFI validates at load, and the packaged-app hardened gates
          # in ci.yml/architectures.yml cover the real bundle path. The
          # full RVT1 exercise then runs under the hardened signature,
          # proving the declared entitlement set is sufficient under
          # Hardened Runtime.
          stage="$RIVET_ROUNDTRIP_STAGE"
          raco rivet entitlements --dev-overlay --plist > "$stage/dev-overlay.plist"
          framework="$stage/Frameworks/Racket.framework"
          inner="$(find "$framework/Versions" -name Racket -type f | head -n 1)"
          codesign --force --sign - --options runtime "$inner"
          codesign --force --sign - --options runtime --entitlements "$stage/dev-overlay.plist" "$stage/RivetIntegration"
          codesign --verify --strict "$stage/RivetIntegration"
          raco rivet entitlements --check-overlay "$stage/RivetIntegration"
          "$stage/RivetIntegration"
      - name: Record embedded benchmark (informational)
        timeout-minutes: 2
        run: |
          "$RIVET_ROUNDTRIP_STAGE/RivetIntegration" --benchmark

  windows-roundtrip:
    name: Windows embedded Racket round trip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        shell: pwsh
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Build integration backend and host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'rivet-roundtrip'
          $runtime = Join-Path $stage 'runtime'
          $res = Join-Path $stage 'res'
          $nativeBuild = Join-Path $env:RUNNER_TEMP 'rivet-native-integration'
          New-Item -ItemType Directory -Force -Path $runtime, $res | Out-Null

          raco ctool `
            --runtime $runtime `
            --runtime-access runtime `
            --mods (Join-Path $res 'core.zo') `
            platform/windows/Integration/backend.rkt

          $racketExe = (Get-Command racket.exe).Source
          $racketRoot = Split-Path $racketExe -Parent
          $include = Join-Path $racketRoot 'include'
          $petite = Get-ChildItem $racketRoot -Recurse -File -Filter petite.boot | Select-Object -First 1
          $scheme = Get-ChildItem $racketRoot -Recurse -File -Filter scheme.boot | Select-Object -First 1
          $racketBoot = Get-ChildItem $racketRoot -Recurse -File -Filter racket.boot | Select-Object -First 1
          $dll = Get-ChildItem $racketRoot -Recurse -File -Filter 'libracketcs*.dll' | Select-Object -First 1
          $def = Get-ChildItem $racketRoot -Recurse -File -Filter 'libracketcs*.def' | Select-Object -First 1
          foreach ($item in @($petite, $scheme, $racketBoot, $dll, $def)) {
            if (-not $item) { throw 'required Racket CS runtime file was not found' }
          }
          Copy-Item $petite.FullName (Join-Path $runtime 'petite.boot') -Force
          Copy-Item $scheme.FullName (Join-Path $runtime 'scheme.boot') -Force
          Copy-Item $racketBoot.FullName (Join-Path $runtime 'racket.boot') -Force
          Copy-Item $dll.FullName (Join-Path $stage $dll.Name) -Force

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw 'Visual Studio C++ tools were not found' }
          $libExe = Get-ChildItem (Join-Path $vsRoot 'VC\Tools\MSVC') -Recurse -File -Filter lib.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\lib\.exe$' } |
            Select-Object -First 1
          if (-not $libExe) { throw 'MSVC lib.exe was not found' }
          $importLib = Join-Path $stage 'libracketcs.lib'
          & $libExe.FullName "/def:$($def.FullName)" "/out:$importLib" /machine:x64
          if ($LASTEXITCODE -ne 0) { throw 'failed to create Racket import library' }

          cmake -S platform/windows/Integration -B $nativeBuild `
            "-DRIVET_ROOT=$PWD" `
            "-DRIVET_RACKET_INCLUDE=$include" `
            "-DRIVET_RACKET_IMPORT_LIB=$importLib"
          cmake --build $nativeBuild --config Release

          $integrationExe = Join-Path $nativeBuild 'Release\RivetIntegration.exe'
          if (-not (Test-Path $integrationExe)) { throw 'integration executable was not produced' }
          Copy-Item $integrationExe (Join-Path $stage 'RivetIntegration.exe') -Force
          "RIVET_ROUNDTRIP_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exercise embedded runtime
        timeout-minutes: 2
        shell: pwsh
        run: '& (Join-Path $env:RIVET_ROUNDTRIP_STAGE "RivetIntegration.exe")'
      - name: Record embedded benchmark (informational)
        timeout-minutes: 2
        shell: pwsh
        run: '& (Join-Path $env:RIVET_ROUNDTRIP_STAGE "RivetIntegration.exe") --benchmark'
