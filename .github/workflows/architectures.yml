name: Desktop Architectures

# Clean-runner build/package/verify evidence for every advertised desktop
# architecture beyond the primary x64/Apple-Silicon entries in ci.yml:
# Windows ARM64, macOS Intel, and Linux AArch64.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architectures-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-arm64:
    name: Windows ARM64 CLI package smoke
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Racket CS 9.3 (arm64, checksum-pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'racket-9.3-arm64-win32-cs.exe'
          # A transient CDN/network failure must not fail an otherwise
          # valid ARM64 package smoke. Keep the immutable SHA-256 check below;
          # never execute a partial or unchecked installer.
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            if (Test-Path $installer) { Remove-Item $installer -Force }
            try {
              Invoke-WebRequest `
                -Uri 'https://download.racket-lang.org/installers/9.3/racket-9.3-arm64-win32-cs.exe' `
                -OutFile $installer -TimeoutSec 120
              break
            } catch {
              if ($attempt -eq 4) { throw }
              Write-Warning "Racket ARM64 installer download attempt $attempt failed; retrying: $_"
              Start-Sleep -Seconds ($attempt * 5)
            }
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '15cd4ace652427465c7c576bad4aede2b8519cb6b59b190c9a22862cf57e7924') {
            throw "Racket 9.3 arm64 installer checksum mismatch: $hash"
          }
          # NSIS silent install; /D must be last and unquoted. On Windows the
          # Racket executables (racket.exe, raco.exe) live in the install root,
          # not a bin/ directory.
          Start-Process -FilePath $installer -ArgumentList '/S','/D=C:\Racket' -Wait -NoNewWindow
          if (-not (Test-Path 'C:\Racket\racket.exe')) {
            throw 'Racket arm64 silent install did not produce C:\Racket\racket.exe'
          }
          Add-Content $env:GITHUB_PATH 'C:\Racket'
      - name: Install Rivet
        shell: pwsh
        # The release installer pins its default catalog to the 9.3 release
        # set, which does not carry family packages (ed25519); resolve
        # package deps through the live catalog instead.
        run: raco pkg install --auto --no-docs --catalog https://pkgs.racket-lang.org --name rivet --link "$PWD"
      - name: Verify signed portable update transaction
        run: raco test rivet/tests/platform-artifact-binding.rkt rivet/tests/platform-update-adapter.rkt rivet/tests/platform-targz-update.rkt
      - name: Check toolchain and JSON diagnostics
        shell: pwsh
        run: |
          raco rivet doctor
          $json = raco rivet doctor --json
          if ($LASTEXITCODE -ne 0) { throw 'raco rivet doctor --json failed' }
          $report = $json | ConvertFrom-Json
          if (-not $report.usable) { throw 'doctor JSON did not report a usable Windows ARM64 toolchain' }
          if (-not $report.runtime.'petite-boot') { throw 'doctor JSON omitted the selected petite.boot' }
          if (-not $report.runtime.'racketcs-dll') { throw 'doctor JSON omitted the selected Racket CS DLL' }
      - name: Compile full schema matrix, package, verify, and clean WinUI app
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rivet-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Location $root
          raco rivet new Smoke
          Set-Location (Join-Path $root 'Smoke')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'rivet\tests\fixtures\schema-matrix-backend.rkt') 'app\backend.rkt' -Force
          New-Item -ItemType Directory -Force -Path 'assets\nested' | Out-Null
          Set-Content -Path 'assets\nested\product.txt' -Value 'packaged-resource' -NoNewline
          $config = Get-Content 'rivet.rktd' -Raw
          $updated = $config.Replace('(resources . ())', '(resources . ("assets"))').Replace('(windows-min-version . "10.0.19041.0")', '(windows-min-version . "10.0.19045.0")')
          if ($updated -eq $config) { throw 'failed to customize windows-min-version smoke value' }
          Set-Content -Path 'rivet.rktd' -Value $updated -NoNewline
          raco rivet schema --output rivet-schema.json
          raco rivet schema check rivet-schema.json --json
          raco rivet build
          raco rivet package
          raco rivet verify
          if (-not (Test-Path 'dist\Smoke-windows-ARM64\RivetHost.exe')) {
            throw 'packaged WinUI ARM64 executable was not produced'
          }
          if ((Get-Content 'dist\Smoke-windows-ARM64\app\assets\nested\product.txt' -Raw) -ne 'packaged-resource') {
            throw 'configured application resource was not preserved in the Windows ARM64 package'
          }
          raco rivet clean
          foreach ($path in @('.rivet', 'build', 'dist')) {
            if (Test-Path $path) { throw "raco rivet clean left generated path: $path" }
          }
          if (-not (Test-Path 'app\backend.rkt')) {
            throw 'raco rivet clean removed application source'
          }

  macos-intel:
    name: macOS Intel CLI package smoke
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        # Same live-catalog resolution as the Windows ARM64 job: the full
        # distribution's default catalog is the release set.
        run: raco pkg install --auto --no-docs --catalog https://pkgs.racket-lang.org --name rivet --link "$PWD"
      - name: Verify default macOS DMG installation layout
        run: raco test rivet/tests/macos-installer.rkt
      - name: Verify signed portable update transaction
        run: raco test rivet/tests/platform-artifact-binding.rkt rivet/tests/platform-update-adapter.rkt rivet/tests/platform-targz-update.rkt
      - name: Check toolchain and JSON diagnostics
        shell: bash
        run: |
          set -euo pipefail
          raco rivet doctor
          report="$RUNNER_TEMP/rivet-doctor.json"
          raco rivet doctor --json > "$report"
          python3 - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)
          assert report["usable"] is True
          assert report["runtime"]["petite-boot"]
          assert report["runtime"]["racket-framework"]
          assert report["tools"]["plutil"]
          PY
      - name: Compile full schema matrix, package, verify, and clean SwiftUI app
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          cp "$GITHUB_WORKSPACE/rivet/tests/fixtures/schema-matrix-backend.rkt" app/backend.rkt
          mkdir -p assets/nested
          printf %s packaged-resource > assets/nested/product.txt
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace('(resources . ())', '(resources . ("assets"))').replace('(macos-min-version . "14.0")', '(macos-min-version . "14.1")')
          if updated == original:
              raise SystemExit("failed to customize macos-min-version smoke value")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet schema --output rivet-schema.json
          raco rivet schema check rivet-schema.json --json
          raco rivet build
          # Canary for downstream codegen shape: every schema-matrix record
          # and enum must surface under the RivetTypes namespace in the
          # generated Swift client - a shape change breaks this first, not
          # product CI (the failure mode reported in #176).
          grep -q 'struct MatrixUser' macos-host/Sources/RivetHost/GeneratedBackend.swift
          grep -q 'RivetTypes.MatrixUser' macos-host/Sources/RivetHost/GeneratedBackend.swift
          grep -q 'enum AccessLevel' macos-host/Sources/RivetHost/GeneratedBackend.swift
          grep -q 'RivetTypes.AccessLevel' macos-host/Sources/RivetHost/GeneratedBackend.swift
          raco rivet package
          raco rivet verify
          test -x dist/Smoke.app/Contents/MacOS/Smoke
          test "$(uname -m)" = x86_64
          test "$(file dist/Smoke.app/Contents/MacOS/Smoke | grep -c x86_64)" -gt 0
          test "$(cat dist/Smoke.app/Contents/Resources/app/assets/nested/product.txt)" = packaged-resource
          codesign --verify --deep --strict dist/Smoke.app
          test "$(plutil -extract LSMinimumSystemVersion raw -o - dist/Smoke.app/Contents/Info.plist)" = "14.1"
          # Hardened-runtime qualification of the declared Intel entitlement
          # set (issue #358): re-sign with the dev overlay (declared keys
          # plus the ad-hoc library-validation exemption), confirm the
          # effective signature matches, and re-run the packaged launch
          # smoke under the hardened signature on x64.
          raco rivet entitlements --dev-overlay --plist > "$root/dev-overlay.plist"
          inner="$(find dist/Smoke.app/Contents/Frameworks/Racket.framework/Versions -name Racket -type f | head -n 1)"
          codesign --force --sign - --options runtime "$inner"
          codesign --force --sign - --options runtime dist/Smoke.app/Contents/Frameworks/Racket.framework
          codesign --force --sign - --options runtime --entitlements "$root/dev-overlay.plist" dist/Smoke.app
          codesign --verify --strict dist/Smoke.app
          raco rivet entitlements --check-overlay dist/Smoke.app
          raco rivet verify
          raco rivet clean
          test ! -e .rivet
          test ! -e build
          test ! -e dist
          test -f app/backend.rkt

  linux-arm64:
    name: Linux ARM64 CLI package smoke
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up embeddable Racket CS
        uses: ./.github/actions/setup-embed-racket
      - name: Install Rivet
        shell: bash
        run: |
          set -euo pipefail
          raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Verify signed portable update transaction
        run: raco test rivet/tests/platform-artifact-binding.rkt rivet/tests/platform-update-adapter.rkt rivet/tests/platform-targz-update.rkt
      - name: Install GTK4 development files and rpm tooling
        run: |
          bash .github/scripts/apt-retry.sh --sudo update
          bash .github/scripts/apt-retry.sh --sudo install --yes --no-install-recommends \
            libgtk-4-dev rpm desktop-file-utils
      - name: Compile full schema matrix, package, and verify a GTK4 app
        shell: bash
        run: |
          set -euo pipefail
          export RIVET_ROOT="$GITHUB_WORKSPACE"

          raco rivet doctor
          root="$(mktemp -d)"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          cp "$GITHUB_WORKSPACE/rivet/tests/fixtures/schema-matrix-backend.rkt" app/backend.rkt
          mkdir -p assets/nested
          printf %s packaged-resource > assets/nested/product.txt
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          def chunk(tag, data):
              crc = zlib.crc32(tag + data) & 0xFFFFFFFF
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", crc)

          ihdr = struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0)
          idat = zlib.compress(b"\x00\x00\x00\x00\xff")
          Path("assets/icon.png").write_bytes(
              b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b""))

          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace('(resources . ())',
                                     '(resources . ("assets")) (linux-icon . "assets/icon.png")')
          if updated == original:
              raise SystemExit("failed to configure Linux ARM64 smoke resource")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet schema --output rivet-schema.json
          raco rivet schema check rivet-schema.json --json
          raco rivet build
          test -x .rivet/stage/RivetHost
          raco rivet package
          raco rivet verify
          test -x dist/Smoke-linux-arm64/RivetHost
          test "$(cat dist/Smoke-linux-arm64/app/assets/nested/product.txt)" = packaged-resource
          file dist/Smoke-linux-arm64/RivetHost | grep -q aarch64
          echo "SMOKE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Build and verify native Linux installer formats
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          cd "$SMOKE_ROOT/Smoke"
          raco rivet release --development --without-updates
          deb="$(ls dist/*.deb)"
          appimage="$(ls dist/*.AppImage)"
          rpm_artifact="$(ls dist/*.rpm)"
          dpkg-deb --info "$deb" | grep -q 'Depends: libgtk-4-1'
          dpkg-deb --info "$deb" | grep -q 'Architecture: arm64'
          rm -rf deb-extract && dpkg-deb -x "$deb" deb-extract
          test -x deb-extract/opt/Smoke/RivetHost
          test -f deb-extract/usr/share/applications/Smoke.desktop
          rpm -qpl --nosignature "$rpm_artifact" | grep -q '/opt/Smoke/RivetHost'
          chmod +x "$appimage"
          rm -rf appimage-extract && "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/RivetHost
          test -f squashfs-root/Smoke.desktop
