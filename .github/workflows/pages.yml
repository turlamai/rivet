name: Pages

# Deploys rivet.jrtx.site from docs/ (the site assets live beside the
# documentation: index.html, CNAME, site.css, family.css/js, fonts).
# Pages must be enabled with the "GitHub Actions" build type.
on:
  push:
    branches: [main]
    paths:
      ["docs/index.html", "docs/CNAME", "docs/site.css", "docs/family.css",
       "docs/family.js", "docs/fonts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
