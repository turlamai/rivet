name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish Racket package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag provenance
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/validate-release-tag.sh \
            "$GITHUB_REF_NAME" \
            origin/main \
            HEAD

      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^(define version "\([^"]*\)")/\1/p' info.rkt)"
          release_version="$(sed -n 's/^(define release-version "\([^"]*\)")/\1/p' info.rkt)"
          if [[ -z "$package_version" || -z "$release_version" ]]; then
            echo "could not read version metadata from info.rkt" >&2
            exit 1
          fi
          if ! racket -e '(require version/utils) (exit (if (valid-version? (vector-ref (current-command-line-arguments) 0)) 0 1))' "$package_version"; then
            echo "info.rkt version $package_version is not a valid Racket package version" >&2
            exit 1
          fi
          if [[ "$tag_version" != "$release_version" ]]; then
            echo "tag version $tag_version does not match info.rkt release-version $release_version" >&2
            exit 1
          fi
          if ! grep -Fxq "## $release_version" CHANGELOG.md; then
            echo "CHANGELOG.md has no ## $release_version section" >&2
            exit 1
          fi
          echo "RIVET_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Install and test Rivet
        shell: bash
        run: |
          set -euo pipefail
          raco pkg install --auto --no-docs --name rivet --link "$PWD"
          raco test rivet/tests/
          raco rivet help

      - name: Build source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          raco pkg create --from-dir --source --format zip --dest dist "$PWD"
          archive="$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "raco pkg create did not produce a zip archive" >&2
            exit 1
          fi
          destination="dist/rivet-${RIVET_VERSION}.zip"
          if [[ "$archive" != "$destination" ]]; then
            mv "$archive" "$destination"
          fi
          # raco pkg create also emits an unversioned .CHECKSUM sidecar; the
          # public inventory is exactly the versioned ZIP, SHA256SUMS and
          # release notes.
          rm -f "$(dirname "$destination")"/*.CHECKSUM
          (cd dist && sha256sum "rivet-${RIVET_VERSION}.zip" > SHA256SUMS)
          awk -v version="$RIVET_VERSION" '
            $0 == "## " version { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md

      - name: Smoke-test source package artifact
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/smoke-source-package.sh \
            "dist/rivet-${RIVET_VERSION}.zip"

      - name: Verify final staged source-release inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-release-source-inventory.py \
            dist "$RIVET_VERSION"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload release package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rivet-${{ env.RIVET_VERSION }}
          path: |
            dist/rivet-${{ env.RIVET_VERSION }}.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/rivet-${RIVET_VERSION}.zip" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --title "Rivet ${RIVET_VERSION}" \
            --notes-file dist/release-notes.md
