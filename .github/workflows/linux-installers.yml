name: Linux Installer Lifecycle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-installers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x64 deb, rpm, and AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up embeddable Racket CS
        uses: ./.github/actions/setup-embed-racket
      - name: Install Rivet and native packaging tools
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/apt-retry.sh --sudo update
          bash .github/scripts/apt-retry.sh --sudo install --yes --no-install-recommends \
            desktop-file-utils libgtk-4-dev libsecret-1-dev rpm
          raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Build release artifacts
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rivet-linux-installers"
          mkdir -p "$root"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          mkdir -p assets/nested
          printf %s packaged-resource-v1 > assets/nested/product.txt
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          def chunk(tag, data):
              crc = zlib.crc32(tag + data) & 0xFFFFFFFF
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", crc)

          ihdr = struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0)
          idat = zlib.compress(b"\x00\x00\x00\x00\xff")
          Path("assets/icon.png").write_bytes(
              b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) +
              chunk(b"IDAT", idat) + chunk(b"IEND", b""))

          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace(
              '(resources . ())',
              '(resources . ("assets")) '
              '(linux-icon . "assets/icon.png") '
              '(linux-formats . ("deb" "rpm"))')
          if updated == original:
              raise SystemExit("failed to configure Linux installer smoke")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet release --development --without-updates
          raco rivet verify
          artifacts="$RUNNER_TEMP/rivet-linux-native-artifacts"
          diagnostics="$RUNNER_TEMP/rivet-linux-build-diagnostics"
          mkdir -p "$artifacts/v1" "$artifacts/v2" "$diagnostics"
          cp dist/*.deb dist/*.rpm "$artifacts/v1/"

          python3 - <<'PY'
          from pathlib import Path

          resource = Path("assets/nested/product.txt")
          resource.write_text("packaged-resource-v2", encoding="utf-8")
          config = Path("rivet.rktd")
          original = config.read_text(encoding="utf-8")
          updated = (original
                     .replace('(version . "0.1.0")', '(version . "0.2.0")')
                     .replace('(build . 1)', '(build . 2)')
                     .replace('(linux-formats . ("deb" "rpm"))',
                              '(linux-formats . ("deb" "rpm" "appimage"))'))
          if updated == original or '(version . "0.2.0")' not in updated:
              raise SystemExit("failed to configure the upgrade candidate")
          config.write_text(updated, encoding="utf-8")
          PY
          raco rivet clean
          raco rivet release --development --without-updates
          raco rivet verify
          cp dist/*.deb dist/*.rpm dist/*.AppImage "$artifacts/v2/"
          sha256sum "$artifacts"/v1/* "$artifacts"/v2/* \
            > "$diagnostics/SHA256SUMS"
          rpm -qpi "$artifacts"/v1/*.rpm "$artifacts"/v2/*.rpm \
            > "$diagnostics/rpm-info.txt"
          rpm -qp --requires "$artifacts"/v2/*.rpm \
            > "$diagnostics/rpm-requires.txt"
          raco rivet doctor --json > "$diagnostics/doctor.json"
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-native-installers
          path: ${{ runner.temp }}/rivet-linux-native-artifacts
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-native-build-diagnostics
          path: ${{ runner.temp }}/rivet-linux-build-diagnostics
          if-no-files-found: warn

  appimage-wayland:
    name: AppImage launch on Ubuntu 24.04 Wayland
    needs: build
    runs-on: ubuntu-24.04
    # The bounded apt install budget (3 x 480 s plus update) must fit inside
    # the job timeout, or a slow-mirror day cancels the job mid-install.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-native-installers
          path: ${{ runner.temp }}/installers
      - name: Install headless Wayland compositor
        run: |
          bash .github/scripts/apt-retry.sh --sudo update
          bash .github/scripts/apt-retry.sh --sudo install --yes --no-install-recommends \
            weston xwayland
      - name: Launch AppImage outside the build tree
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/rivet-appimage-diagnostics"
          mkdir -p "$diagnostics"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/rivet-appimage-runtime"
          export WAYLAND_DISPLAY=wayland-rivet-appimage
          export GDK_BACKEND=wayland
          unset DISPLAY
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            --log="$diagnostics/weston.log" &
          weston_pid=$!
          app_pid=""
          stop_bounded() {
            local pid="$1"
            local label="$2"
            kill -TERM "$pid" 2>/dev/null || true
            for _ in $(seq 1 200); do
              kill -0 "$pid" 2>/dev/null || return 0
              sleep 0.05
            done
            kill -KILL "$pid" 2>/dev/null || true
            echo "$label did not stop within ten seconds of SIGTERM" >&2
            return 1
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              stop_bounded "$app_pid" application || status=1
              wait "$app_pid" 2>/dev/null || true
            fi
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || {
              cat "$diagnostics/weston.log"
              exit 1
            }
            sleep 0.05
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          appimage="$(find "$RUNNER_TEMP/installers/v2" -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" >"$diagnostics/application.log" 2>&1 &
          app_pid=$!
          for _ in $(seq 1 50); do
            kill -0 "$app_pid" 2>/dev/null || {
              wait "$app_pid" || true
              cat "$diagnostics/application.log"
              exit 1
            }
            sleep 0.1
          done
          stop_bounded "$app_pid" application
          wait "$app_pid" || test "$?" -eq 143
          app_pid=""
          trap - EXIT
          kill "$weston_pid" 2>/dev/null || true
          wait "$weston_pid" 2>/dev/null || true
      - name: Upload AppImage diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-appimage-wayland-diagnostics
          path: ${{ runner.temp }}/rivet-appimage-diagnostics
          if-no-files-found: warn

  debian-deb-wayland:
    name: deb install, upgrade, launch, and recover on Debian 13 Wayland
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:13
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-native-installers
          path: /tmp/rivet-installers
      - name: Install desktop runtime
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes \
            dbus-daemon desktop-file-utils libgtk-4-1 libsecret-1-0 \
            procps weston
      - name: Install, recover, upgrade, reject downgrade, launch, and uninstall deb
        shell: bash
        run: |
          set -euo pipefail
          diagnostics=/tmp/rivet-debian-diagnostics
          mkdir -p "$diagnostics"
          # Installer-owned files live under /opt. User-owned data and config
          # deliberately live in disposable external XDG roots.
          export XDG_DATA_HOME="$diagnostics/xdg-data"
          export XDG_CONFIG_HOME="$diagnostics/xdg-config"
          data_sentinel="$XDG_DATA_HOME/dev.rivet.acceptance/user-data.txt"
          config_sentinel="$XDG_CONFIG_HOME/dev.rivet.acceptance/preferences.txt"
          mkdir -p "$(dirname "$data_sentinel")" "$(dirname "$config_sentinel")"
          printf '%s' 'retained-document' > "$data_sentinel"
          printf '%s' 'retained-settings' > "$config_sentinel"
          assert_user_state() {
            if [[ ! -f "$data_sentinel" ]] ||
               [[ "$(cat "$data_sentinel")" != retained-document ]] ||
               [[ ! -f "$config_sentinel" ]] ||
               [[ "$(cat "$config_sentinel")" != retained-settings ]]; then
              echo "native package transaction changed XDG data or settings" >&2
              return 1
            fi
          }
          deb_v1="$(find /tmp/rivet-installers/v1 -type f -name '*.deb' -print -quit)"
          deb_v2="$(find /tmp/rivet-installers/v2 -type f -name '*.deb' -print -quit)"
          test -n "$deb_v1"
          test -n "$deb_v2"
          deb_package="$(dpkg-deb --field "$deb_v1" Package)"
          test -n "$deb_package"
          apt-get install --yes "$deb_v1" >"$diagnostics/apt-install-v1.log" 2>&1
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' \
            "$deb_package" >"$diagnostics/installed-version-v1.txt"
          test "$(dpkg-query --show --showformat='${Version}' "$deb_package")" = "0.1.0-1"
          test -x /opt/Smoke/RivetHost
          test -f /usr/share/applications/Smoke.desktop
          test -f /usr/share/pixmaps/Smoke.png
          desktop-file-validate /usr/share/applications/Smoke.desktop
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource-v1
          assert_user_state

          # A truncated upgrade candidate must fail before the package manager
          # mutates the working installation.
          cp "$deb_v2" /tmp/corrupt-upgrade.deb
          truncate --size 64 /tmp/corrupt-upgrade.deb
          if apt-get install --yes /tmp/corrupt-upgrade.deb \
              >"$diagnostics/apt-corrupt-upgrade.log" 2>&1; then
            echo "apt unexpectedly accepted a corrupt upgrade" >&2
            exit 1
          fi
          test "$(dpkg-query --show --showformat='${Version}' "$deb_package")" = "0.1.0-1"
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource-v1
          assert_user_state

          apt-get install --yes "$deb_v2" >"$diagnostics/apt-upgrade-v2.log" 2>&1
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' \
            "$deb_package" >"$diagnostics/installed-version-v2.txt"
          test "$(dpkg-query --show --showformat='${Version}' "$deb_package")" = "0.2.0-2"
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource-v2
          assert_user_state

          if apt-get install --yes "$deb_v1" \
              >"$diagnostics/apt-downgrade-attempt.log" 2>&1; then
            echo "apt unexpectedly downgraded without --allow-downgrades" >&2
            exit 1
          fi
          test "$(dpkg-query --show --showformat='${Version}' "$deb_package")" = "0.2.0-2"
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource-v2
          assert_user_state

          export XDG_RUNTIME_DIR=/tmp/rivet-debian-wayland-runtime
          export WAYLAND_DISPLAY=wayland-rivet-debian
          export GDK_BACKEND=wayland
          unset DISPLAY
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            --log="$diagnostics/weston.log" &
          weston_pid=$!
          app_pid=""
          stop_bounded() {
            local pid="$1"
            local label="$2"
            kill -TERM "$pid" 2>/dev/null || true
            for _ in $(seq 1 200); do
              kill -0 "$pid" 2>/dev/null || return 0
              sleep 0.05
            done
            kill -KILL "$pid" 2>/dev/null || true
            echo "$label did not stop within ten seconds of SIGTERM" >&2
            return 1
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              stop_bounded "$app_pid" application || status=1
              wait "$app_pid" 2>/dev/null || true
            fi
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
            apt-get remove --yes "$deb_package" \
              >>"$diagnostics/apt-remove.log" 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || {
              cat "$diagnostics/weston.log"
              exit 1
            }
            sleep 0.05
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          /opt/Smoke/RivetHost >"$diagnostics/application.log" 2>&1 &
          app_pid=$!
          for _ in $(seq 1 50); do
            kill -0 "$app_pid" 2>/dev/null || {
              wait "$app_pid" || true
              cat "$diagnostics/application.log"
              exit 1
            }
            sleep 0.1
          done
          stop_bounded "$app_pid" application
          wait "$app_pid" || test "$?" -eq 143
          app_pid=""
          kill "$weston_pid" 2>/dev/null || true
          wait "$weston_pid" 2>/dev/null || true
          apt-get remove --yes "$deb_package" >"$diagnostics/apt-remove.log" 2>&1
          test ! -e /opt/Smoke/RivetHost
          test ! -e /usr/share/applications/Smoke.desktop
          test ! -e /usr/share/pixmaps/Smoke.png
          assert_user_state
          trap - EXIT
      - name: Upload Debian diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-deb-wayland-diagnostics
          path: /tmp/rivet-debian-diagnostics
          if-no-files-found: warn

  fedora-rpm-wayland:
    name: rpm install, upgrade, launch, and recover on Fedora 44 Wayland
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: fedora:44
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-native-installers
          path: /tmp/rivet-installers
      - name: Install desktop runtime
        run: dnf install --assumeyes dbus-daemon desktop-file-utils gtk4 procps-ng weston
      - name: Install, recover, upgrade, roll back, re-upgrade, launch, and uninstall rpm
        shell: bash
        run: |
          set -euo pipefail
          diagnostics=/tmp/rivet-fedora-diagnostics
          mkdir -p "$diagnostics"
          # Installer-owned files live under /opt. User-owned data and config
          # deliberately live in disposable external XDG roots.
          export XDG_DATA_HOME="$diagnostics/xdg-data"
          export XDG_CONFIG_HOME="$diagnostics/xdg-config"
          data_sentinel="$XDG_DATA_HOME/dev.rivet.acceptance/user-data.txt"
          config_sentinel="$XDG_CONFIG_HOME/dev.rivet.acceptance/preferences.txt"
          mkdir -p "$(dirname "$data_sentinel")" "$(dirname "$config_sentinel")"
          printf '%s' 'retained-document' > "$data_sentinel"
          printf '%s' 'retained-settings' > "$config_sentinel"
          assert_user_state() {
            if [[ ! -f "$data_sentinel" ]] ||
               [[ "$(cat "$data_sentinel")" != retained-document ]] ||
               [[ ! -f "$config_sentinel" ]] ||
               [[ "$(cat "$config_sentinel")" != retained-settings ]]; then
              echo "native package transaction changed XDG data or settings" >&2
              return 1
            fi
          }
          rpm_v1="$(find /tmp/rivet-installers/v1 -type f -name '*.rpm' -print -quit)"
          rpm_v2="$(find /tmp/rivet-installers/v2 -type f -name '*.rpm' -print -quit)"
          test -n "$rpm_v1"
          test -n "$rpm_v2"
          rpm_package="$(rpm -qp --qf '%{NAME}' "$rpm_v1")"
          test -n "$rpm_package"
          dnf install --assumeyes "$rpm_v1" >"$diagnostics/dnf-install-v1.log" 2>&1
          rpm -q --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$rpm_package" \
            >"$diagnostics/installed-version-v1.txt"
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' "$rpm_package")" = "0.1.0-1"
          test -x /opt/Smoke/RivetHost
          test -f /usr/share/applications/Smoke.desktop
          test -f /usr/share/pixmaps/Smoke.png
          desktop-file-validate /usr/share/applications/Smoke.desktop
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource-v1
          assert_user_state

          cp "$rpm_v2" /tmp/corrupt-upgrade.rpm
          truncate --size 64 /tmp/corrupt-upgrade.rpm
          if dnf install --assumeyes /tmp/corrupt-upgrade.rpm \
              >"$diagnostics/dnf-corrupt-upgrade.log" 2>&1; then
            echo "dnf unexpectedly accepted a corrupt upgrade" >&2
            exit 1
          fi
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' "$rpm_package")" = "0.1.0-1"
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource-v1
          assert_user_state

          dnf install --assumeyes "$rpm_v2" >"$diagnostics/dnf-upgrade-v2.log" 2>&1
          rpm -q --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$rpm_package" \
            >"$diagnostics/installed-version-v2.txt"
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' "$rpm_package")" = "0.2.0-2"
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource-v2
          assert_user_state

          # DNF treats an explicitly selected older local RPM as an authorized
          # rollback. Prove that its transaction restores the complete v1
          # payload, then prove recovery to v2 before launching the app.
          dnf install --assumeyes "$rpm_v1" \
            >"$diagnostics/dnf-rollback-v1.log" 2>&1
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' "$rpm_package")" = "0.1.0-1"
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource-v1
          assert_user_state

          dnf install --assumeyes "$rpm_v2" \
            >"$diagnostics/dnf-reupgrade-v2.log" 2>&1
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' "$rpm_package")" = "0.2.0-2"
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource-v2
          assert_user_state

          export XDG_RUNTIME_DIR=/tmp/rivet-fedora-wayland-runtime
          export WAYLAND_DISPLAY=wayland-rivet-fedora
          export GDK_BACKEND=wayland
          unset DISPLAY
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            --log="$diagnostics/weston.log" &
          weston_pid=$!
          app_pid=""
          stop_bounded() {
            local pid="$1"
            local label="$2"
            kill -TERM "$pid" 2>/dev/null || true
            for _ in $(seq 1 200); do
              kill -0 "$pid" 2>/dev/null || return 0
              sleep 0.05
            done
            kill -KILL "$pid" 2>/dev/null || true
            echo "$label did not stop within ten seconds of SIGTERM" >&2
            return 1
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              stop_bounded "$app_pid" application || status=1
              wait "$app_pid" 2>/dev/null || true
            fi
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
            dnf remove --assumeyes "$rpm_package" >>"$diagnostics/dnf-remove.log" 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || {
              cat "$diagnostics/weston.log"
              exit 1
            }
            sleep 0.05
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          /opt/Smoke/RivetHost >"$diagnostics/application.log" 2>&1 &
          app_pid=$!
          for _ in $(seq 1 50); do
            kill -0 "$app_pid" 2>/dev/null || {
              wait "$app_pid" || true
              cat "$diagnostics/application.log"
              exit 1
            }
            sleep 0.1
          done
          stop_bounded "$app_pid" application
          wait "$app_pid" || test "$?" -eq 143
          app_pid=""
          kill "$weston_pid" 2>/dev/null || true
          wait "$weston_pid" 2>/dev/null || true
          dnf remove --assumeyes "$rpm_package" >"$diagnostics/dnf-remove.log" 2>&1
          test ! -e /opt/Smoke/RivetHost
          test ! -e /usr/share/applications/Smoke.desktop
          test ! -e /usr/share/pixmaps/Smoke.png
          assert_user_state
          trap - EXIT
      - name: Upload Fedora diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora-rpm-wayland-diagnostics
          path: /tmp/rivet-fedora-diagnostics
          if-no-files-found: warn

  flatpak:
    name: Flatpak bundle on Ubuntu 24.04
    runs-on: ubuntu-24.04
    # The GNOME runtime and SDK download is large and the pinned lz4/ncurses
    # modules compile inside the sandbox; keep a realistic wall clock.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up embeddable Racket CS
        uses: ./.github/actions/setup-embed-racket
      - name: Install Rivet and Flatpak tooling
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/apt-retry.sh --sudo update
          bash .github/scripts/apt-retry.sh --sudo install --yes --no-install-recommends \
            desktop-file-utils flatpak flatpak-builder libgtk-4-dev libsecret-1-dev
          raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Install the GNOME runtime and SDK
        shell: bash
        run: |
          set -euo pipefail
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform//50" "org.gnome.Sdk//50"
      - name: Build the Flatpak smoke bundle
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rivet-flatpak-smoke"
          mkdir -p "$root"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          mkdir -p assets
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          def chunk(tag, data):
              crc = zlib.crc32(tag + data) & 0xFFFFFFFF
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", crc)

          ihdr = struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0)
          idat = zlib.compress(b"\x00\x00\x00\x00\xff")
          Path("assets/icon.png").write_bytes(
              b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) +
              chunk(b"IDAT", idat) + chunk(b"IEND", b""))

          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace(
              '(resources . ())',
              '(resources . ("assets")) '
              '(linux-icon . "assets/icon.png") '
              '(linux-formats . ("flatpak")) '
              '(flatpak-finish-args . ("--socket=x11" "--device=dri" "--share=ipc"))')
          if updated == original:
              raise SystemExit("failed to configure the Flatpak smoke")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet release --development --without-updates
          raco rivet verify
          test -n "$(find dist -maxdepth 1 -name '*.flatpak' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.flatpak.sha256' -print -quit)"
      - name: Import and inspect the produced bundle
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/rivet-flatpak-diagnostics"
          mkdir -p "$diagnostics"
          bundle="$(find "$RUNNER_TEMP/rivet-flatpak-smoke/Smoke/dist" -maxdepth 1 -name '*.flatpak' -print -quit)"
          test -n "$bundle"
          cp "$bundle" "$diagnostics/"
          flatpak install --user -y --noninteractive "$bundle"
          app_id="$(flatpak list --user --columns=application | grep -i '\.smoke$' | head -1)"
          test -n "$app_id"
          flatpak info --user "$app_id" | tee "$diagnostics/flatpak-info.txt"
          flatpak uninstall --user -y "$app_id"
          sha256sum "$bundle" > "$diagnostics/SHA256SUMS"
          raco rivet doctor --json > "$diagnostics/doctor.json"
      - name: Upload Flatpak diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-diagnostics
          path: ${{ runner.temp }}/rivet-flatpak-diagnostics
          if-no-files-found: warn
