name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Keep every main quality gate; supersede only older runs of the same PR.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  racket-minimum:
    name: Racket 9.0 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up minimum supported Racket CS
        uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.0'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Test
        run: raco test rivet/tests/

  racket:
    name: Racket core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate CI latency reporter
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_latency.py'
      - name: Test source-release inventory validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_source_inventory.py'
      - name: Test release tag provenance validator
        shell: bash
        run: bash .github/scripts/test-release-tag.sh
      - name: Test bounded apt retry wrapper
        shell: bash
        run: bash .github/scripts/test-apt-retry.sh
      - name: Test Apple release preflight without publisher credentials
        run: python3 .github/scripts/test-apple-review-preflight.py
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Test
        run: raco test rivet/tests/
      - name: Test Taskboard real RVT1 persistence and storage failures
        run: raco test examples/taskboard/tests/
      - name: Build Scribble documentation
        shell: bash
        run: |
          set -euo pipefail
          doc_dir="$RUNNER_TEMP/rivet-docs"
          mkdir -p "$doc_dir"
          raco scribble ++xref-in setup/xref load-collections-xref \
            --htmls --dest "$doc_dir" rivet/scribblings/rivet.scrbl
          test -s "$doc_dir/rivet/index.html"
      - name: Check CLI
        run: raco rivet help
      - name: Smoke-test SBOM, notices, and license audit
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/rivet-compliance-smoke"
          mkdir -p "$smoke"
          cd "$smoke"
          raco rivet new ComplianceSmoke
          cd ComplianceSmoke
          raco rivet compliance
          test -s dist/sbom.cdx.json
          test -s dist/THIRD_PARTY_NOTICES.txt
          python3 - <<'PY'
          import json
          with open("dist/sbom.cdx.json", encoding="utf-8") as handle:
              document = json.load(handle)
          assert document["bomFormat"] == "CycloneDX"
          assert document["specVersion"] == "1.6"
          assert all(item.get("licenses") for item in document["components"])
          PY
      - name: Check release metadata and source package artifact
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^(define version "\([^"]*\)")/\1/p' info.rkt)"
          release_version="$(sed -n 's/^(define release-version "\([^"]*\)")/\1/p' info.rkt)"
          if ! racket -e '(require version/utils) (exit (if (valid-version? (vector-ref (current-command-line-arguments) 0)) 0 1))' "$package_version"; then
            echo "info.rkt version must be a valid Racket package version" >&2
            exit 1
          fi
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "info.rkt release-version must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          grep -Fxq "## $release_version" CHANGELOG.md
          package_dir="$RUNNER_TEMP/rivet-package"
          mkdir -p "$package_dir"
          raco pkg create --from-dir --source --format zip --dest "$package_dir" "$PWD"
          archive="$(find "$package_dir" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "raco pkg create did not produce a zip archive" >&2
            exit 1
          fi
          bash .github/scripts/smoke-source-package.sh "$archive"

  native-protocol:
    name: Native protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S runtime -B build/native -DRIVET_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/native --config Release
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure

  swift-runtime:
    name: Swift protocol/runtime
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Test Swift runtime and C bridge
        shell: bash
        run: |
          set -euo pipefail
          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          swift test --package-path platform/macos -Xcc "-I${racket_include}"
      - name: Compile portable Apple device targets
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rivet-apple-device-codegen"
          mkdir -p "$root"
          cd "$root"
          raco rivet new AppleDeviceSmoke
          cd AppleDeviceSmoke
          cp "$GITHUB_WORKSPACE/rivet/tests/fixtures/schema-matrix-backend.rkt" app/backend.rkt
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace(
              '(device-rpcs . ())',
              '(device-rpcs . (roundtrip-user roundtrip-optional-string no-result))',
          )
          if updated == original:
              raise SystemExit("failed to configure Apple device RPC exports")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet schema --output rivet-schema.json
          raco rivet schema check rivet-schema.json --json
          raco rivet generate
          fixture="$GITHUB_WORKSPACE/rivet/tests/fixtures/apple-device-codegen/Sources/AppleDeviceCodegenFixture"
          cp macos-host/Sources/RivetHost/GeneratedBackend.swift "$fixture/GeneratedBackend.swift"

          cd "$GITHUB_WORKSPACE/platform/macos"
          for scheme in RivetRuntime RivetWatchConnectivity; do
            xcodebuild \
              -workspace . \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/rivet-${scheme}-ios" \
              CODE_SIGNING_ALLOWED=NO \
              build
            xcodebuild \
              -workspace . \
              -scheme "$scheme" \
              -destination 'generic/platform=watchOS' \
              -derivedDataPath "$RUNNER_TEMP/rivet-${scheme}-watchos" \
              CODE_SIGNING_ALLOWED=NO \
              build
          done
          # iPadOS shares the iOS simulator/device SDK with iPhone. Build
          # both iOS and watchOS simulator slices, not only generic devices.
          for scheme in RivetRuntime RivetWatchConnectivity; do
            for destination in 'iOS Simulator' 'watchOS Simulator'; do
              xcodebuild \
                -workspace . \
                -scheme "$scheme" \
                -destination "generic/platform=$destination" \
                -derivedDataPath "$RUNNER_TEMP/rivet-$scheme-${destination// /-}" \
                CODE_SIGNING_ALLOWED=NO \
                build
            done
          done
          for scheme in \
            RivetDeviceAppleSecurity \
            RivetDeviceSession \
            RivetDeviceAppleTransport \
            RivetDeviceAppleCompanion \
            RivetDeviceAppleCompanionUI; do
            for platform in iOS 'iOS Simulator' macOS; do
              xcodebuild \
                -workspace . \
                -scheme "$scheme" \
                -destination "generic/platform=$platform" \
                -derivedDataPath "$RUNNER_TEMP/rivet-$scheme-$platform" \
                CODE_SIGNING_ALLOWED=NO \
                build
            done
          done

          cd "$GITHUB_WORKSPACE/rivet/tests/fixtures/apple-device-codegen"
          for platform in iOS watchOS; do
            xcodebuild \
              -workspace . \
              -scheme AppleDeviceCodegenFixture \
              -destination "generic/platform=${platform}" \
              -derivedDataPath "$RUNNER_TEMP/rivet-device-codegen-${platform}" \
              CODE_SIGNING_ALLOWED=NO \
              build
          done

  kotlin-runtime:
    name: Kotlin protocol/runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Compile the generated typed client from the shared schema matrix
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rivet-kotlin-codegen"
          mkdir -p "$root"
          cd "$root"
          raco rivet new KtSmoke
          cd KtSmoke
          cp "$GITHUB_WORKSPACE/rivet/tests/fixtures/schema-matrix-backend.rkt" app/backend.rkt
          # The Kotlin client exists only for projects with a declared
          # companion API (issue #311); this smoke is the Android consumer.
          racket -e '(require racket/file) (define p "rivet.rktd") (define c (call-with-input-file p read)) (call-with-output-file p #:exists (quote truncate/replace) (lambda (out) (write (hash-set c (quote device-rpcs) (list (quote greet) (quote increment))) out)))'
          raco rivet schema --output rivet-schema.json
          raco rivet schema check rivet-schema.json --json
          raco rivet generate
          generated=".rivet/generated/kotlin/dev/rivet/generated/GeneratedBackend.kt"
          test -s "$generated"
          destination="$GITHUB_WORKSPACE/platform/android/src/test/kotlin/dev/rivet/generated"
          mkdir -p "$destination"
          cp "$generated" "$destination/GeneratedBackend.kt"
      - name: Test Kotlin runtime against shared RVT1 vectors
        run: platform/android/gradlew -p platform/android test
      - name: Compile Android native NSD adapter against API 35
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          if [ ! -f "$sdk_root/platforms/android-35/android.jar" ]; then
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platforms;android-35'
          fi
          test -f "$sdk_root/platforms/android-35/android.jar"
          platform/android/gradlew -p platform/android :android-nsd:compileKotlin

  windows-host:
    name: Windows CLI package smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Build the device gateway smoke
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $msbuild "platform\windows\rivet-device-smoke.vcxproj" /p:RIVET_ROOT="$env:GITHUB_WORKSPACE" /p:Configuration=Release /p:Platform=x64 /m /nologo /v:m
      - name: Run Windows device gateway identity and listener lifecycle smoke
        shell: pwsh
        run: |
          # The preceding MSBuild job already compiles the real CNG,
          # SChannel, listener, and DNS-SD integration. Exercise it instead
          # of accepting compile-only evidence for the Windows M3 adapter.
          @'
          import os
          import pathlib
          import re
          import subprocess

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          candidates = sorted(
              path for path in workspace.rglob("*.exe")
              if path.stem.lower() in ("rivet-device-smoke", "rivetdevicesmoke")
          )
          if len(candidates) != 1:
              raise SystemExit(
                  "expected exactly one built Windows device gateway smoke exe, "
                  f"found {len(candidates)}: {candidates}"
              )

          # The smoke reads one line from stdin to stop. A bounded subprocess
          # proves identity creation, listener/advertisement startup, and
          # clean teardown on a real Windows runner without hanging CI.
          for arguments in ([], ["--pair"]):
              # The --pair case exercises de-registration/re-publication of
              # the canonical pairing-window TXT bit while the listener runs.
              result = subprocess.run(
                  [str(candidates[0]), *arguments],
                  input="\n",
                  text=True,
                  capture_output=True,
                  timeout=30,
                  check=False,
              )
              print(result.stdout)
              if result.returncode != 0:
                  raise SystemExit(
                      f"device gateway smoke {arguments} exited "
                      f"{result.returncode}: {result.stderr}"
                  )
              if not re.search(
                  r"identity certificate ready; spki-sha256 [0-9a-f]{64}",
                  result.stdout,
              ):
                  raise SystemExit("Windows smoke did not create the TLS identity")
              if not re.search(
                  r"listener ready on port [1-9][0-9]*; advertisement id [0-9a-f]{32}",
                  result.stdout,
              ):
                  raise SystemExit("Windows smoke did not start its listener")
              if bool(arguments) != ("pairing window open" in result.stdout):
                  raise SystemExit("Windows smoke reported incorrect pairing state")
              if "stopped cleanly" not in result.stdout:
                  raise SystemExit("Windows smoke did not stop cleanly")
          '@ | python -
      - name: Install Rivet
        shell: pwsh
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Verify signed portable update transaction
        shell: pwsh
        run: raco test rivet/tests/platform-artifact-binding.rkt rivet/tests/platform-update-adapter.rkt rivet/tests/platform-targz-update.rkt
      - name: Check toolchain and JSON diagnostics
        shell: pwsh
        run: |
          raco rivet doctor
          $json = raco rivet doctor --json
          if ($LASTEXITCODE -ne 0) { throw 'raco rivet doctor --json failed' }
          $report = $json | ConvertFrom-Json
          if (-not $report.usable) { throw 'doctor JSON did not report a usable Windows toolchain' }
          if (-not $report.runtime.'petite-boot') { throw 'doctor JSON omitted the selected petite.boot' }
          if (-not $report.runtime.'racketcs-dll') { throw 'doctor JSON omitted the selected Racket CS DLL' }
      - name: Compile full schema matrix, package, verify, and clean WinUI app
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rivet-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Location $root
          raco rivet new Smoke
          Set-Location (Join-Path $root 'Smoke')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'rivet\tests\fixtures\schema-matrix-backend.rkt') 'app\backend.rkt' -Force
          New-Item -ItemType Directory -Force -Path 'assets\nested' | Out-Null
          Set-Content -Path 'assets\nested\product.txt' -Value 'packaged-resource' -NoNewline
          $config = Get-Content 'rivet.rktd' -Raw
          $updated = $config.Replace('(resources . ())', '(resources . ("assets"))').Replace('(windows-min-version . "10.0.19041.0")', '(windows-min-version . "10.0.19045.0")')
          if ($updated -eq $config) { throw 'failed to customize windows-min-version smoke value' }
          Set-Content -Path 'rivet.rktd' -Value $updated -NoNewline
          raco rivet schema --output rivet-schema.json
          raco rivet schema check rivet-schema.json --json
          raco rivet build
          raco rivet package
          raco rivet verify
          if (-not (Test-Path 'dist\Smoke-windows-x64\RivetHost.exe')) {
            throw 'packaged WinUI executable was not produced'
          }
          if ((Get-Content 'dist\Smoke-windows-x64\app\assets\nested\product.txt' -Raw) -ne 'packaged-resource') {
            throw 'configured application resource was not preserved in the Windows package'
          }
          raco rivet clean
          foreach ($path in @('.rivet', 'build', 'dist')) {
            if (Test-Path $path) { throw "raco rivet clean left generated path: $path" }
          }
          if (-not (Test-Path 'app\backend.rkt')) {
            throw 'raco rivet clean removed application source'
          }
      - name: MSI first launch, repair, running-app upgrade, data retention, and uninstall smoke
        shell: pwsh
        run: |
          # Issue #370: installed-package upgrade acceptance, not only
          # portable packaging. Two development releases of the same Smoke
          # app produce two MSIs with the same UpgradeCode; install, upgrade
          # in place, refuse the downgrade, then uninstall cleanly.
          dotnet tool install --global wix --version 5.*
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $root = Join-Path $env:RUNNER_TEMP 'rivet-msi-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Location $root
          raco rivet new Smoke
          Set-Location (Join-Path $root 'Smoke')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'rivet\tests\fixtures\schema-matrix-backend.rkt') 'app\backend.rkt' -Force
          # The fixture backend's contract differs from the scaffold baseline;
          # regenerate the compatibility baseline before any build.
          raco rivet schema --output rivet-schema.json
          New-Item -ItemType Directory -Force -Path 'assets\nested' | Out-Null
          Set-Content -Path 'assets\nested\product.txt' -Value 'msi-v1' -NoNewline
          $config = Get-Content 'rivet.rktd' -Raw
          $updated = $config.Replace('(resources . ())', '(resources . ("assets"))')
          if ($updated -eq $config) { throw 'failed to configure the assets resource directory' }
          Set-Content -Path 'rivet.rktd' -Value $updated -NoNewline
          $config = Get-Content 'rivet.rktd' -Raw
          if ($config -notmatch '0\.1\.0') { throw 'expected scaffold version 0.1.0' }
          raco rivet release --development --without-updates
          $v1 = Get-ChildItem 'dist\*-0.1.0-windows-*.msi' | Select-Object -First 1
          if (-not $v1) { throw 'development release did not produce the 0.1.0 MSI' }
          $installRoot = 'C:\Program Files\Smoke'
          $installedResource = Join-Path $installRoot 'app\assets\nested\product.txt'
          $p = Start-Process msiexec -ArgumentList "/i", "`"$($v1.FullName)`"", "/qn", "/norestart", "/L*v", "$root\install-v1.log" -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { Get-Content "$root\install-v1.log" -Tail 40; throw "MSI v1 install failed with $($p.ExitCode)" }
          if ((Get-Content $installedResource -Raw) -ne 'msi-v1') { throw 'installed payload does not carry the v1 marker' }
          # First-install launch acceptance must use the *installed* executable,
          # not a build-tree or unpacked portable smoke. A process that exists
          # without a native top-level window does not satisfy Launch.
          $installedExe = Join-Path $installRoot 'RivetHost.exe'
          if (-not (Test-Path $installedExe)) { throw 'MSI did not install the native executable' }
          $launched = Start-Process -FilePath $installedExe -WorkingDirectory $installRoot -PassThru
          try {
            $windowSeen = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $launched.Refresh()
              if ($launched.HasExited) {
                throw "first installed launch exited before showing a window: $($launched.ExitCode)"
              }
              if ($launched.MainWindowHandle -ne [IntPtr]::Zero) {
                $windowSeen = $true
                break
              }
            }
            if (-not $windowSeen) { throw 'installed app remained in background without a main window' }
            # A normal window close must release the executable before upgrade.
            if (-not $launched.CloseMainWindow()) {
              throw 'installed app window did not accept a normal close request'
            }
            if (-not $launched.WaitForExit(10000)) {
              throw 'installed app left its process running after window close'
            }
          } finally {
            # Do not let a failing smoke strand a process that would corrupt
            # subsequent MSI upgrade assertions or the next CI attempt.
            $launched.Refresh()
            if (-not $launched.HasExited) {
              Stop-Process -Id $launched.Id -Force -ErrorAction SilentlyContinue
              $launched.WaitForExit(5000) | Out-Null
            }
          }
          # Repair the installed MSI via Windows Installer itself, with the
          # application closed. This must not become a silent replacement of
          # product-owned data in the user's profile or defer until reboot.
          $userDataRoot = Join-Path $env:LOCALAPPDATA ("rivet-msi-acceptance-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $userDataRoot | Out-Null
          $userDataFile = Join-Path $userDataRoot 'user-state.txt'
          Set-Content -Path $userDataFile -Value 'retain-across-installer-lifecycle' -NoNewline
          $p = Start-Process msiexec -ArgumentList "/fa", "`"$($v1.FullName)`"", "/qn", "/norestart", "/L*v", "$root\repair-v1.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$root\repair-v1.log" -Tail 80
            throw "MSI v1 repair failed or deferred until reboot with $($p.ExitCode)"
          }
          if ((Get-Content $installedResource -Raw) -ne 'msi-v1') {
            throw 'MSI repair lost or changed the installed v1 payload'
          }
          if ((Get-Content $userDataFile -Raw) -ne 'retain-across-installer-lifecycle') {
            throw 'MSI repair damaged user data outside Program Files'
          }
          # Upgrade in place: same UpgradeCode, higher product version.
          Set-Content -Path 'assets\nested\product.txt' -Value 'msi-v2' -NoNewline
          $config = Get-Content 'rivet.rktd' -Raw
          $updated = $config.Replace('(version . "0.1.0")', '(version . "0.2.0")')
          if ($updated -eq $config) { throw 'failed to bump the scaffold version' }
          Set-Content -Path 'rivet.rktd' -Value $updated -NoNewline
          raco rivet release --development --without-updates
          $v2 = Get-ChildItem 'dist\*-0.2.0-windows-*.msi' | Select-Object -First 1
          if (-not $v2) { throw 'development release did not produce the 0.2.0 MSI' }
          # Running-process upgrade: do not pre-close v1. Silent MSI's
          # Restart Manager must release the installed files without a reboot.
          $runningV1 = Start-Process -FilePath $installedExe -WorkingDirectory $installRoot -PassThru
          $upgradeProcess = $null
          try {
            $windowSeen = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $runningV1.Refresh()
              if ($runningV1.HasExited) {
                throw "v1 exited before running-app upgrade: $($runningV1.ExitCode)"
              }
              if ($runningV1.MainWindowHandle -ne [IntPtr]::Zero) {
                $windowSeen = $true
                break
              }
            }
            if (-not $windowSeen) { throw 'installed v1 never showed a native window' }
            $upgradeLog = "$root\upgrade-running.log"
            $upgradeProcess = Start-Process msiexec -ArgumentList "/i", "`"$($v2.FullName)`"", "/qn", "/norestart", "/L*v", $upgradeLog -PassThru
            if (-not $upgradeProcess.WaitForExit(120000)) {
              if (Test-Path $upgradeLog) { Get-Content $upgradeLog -Tail 100 }
              throw 'MSI v2 upgrade stalled while installed v1 was still running'
            }
            if ($upgradeProcess.ExitCode -ne 0) {
              if (Test-Path $upgradeLog) { Get-Content $upgradeLog -Tail 100 }
              throw "running-app upgrade failed or deferred until reboot: $($upgradeProcess.ExitCode)"
            }
            if (-not $runningV1.WaitForExit(15000)) {
              throw 'MSI upgrade left the old installed v1 process running'
            }
            if ((Get-Content $installedResource -Raw) -ne 'msi-v2') {
              throw 'running-app upgrade did not install the v2 payload'
            }
            if ((Get-Content $userDataFile -Raw) -ne 'retain-across-installer-lifecycle') {
              throw 'running-app MSI upgrade damaged user data outside Program Files'
            }
          } finally {
            # Kill only as test cleanup on failure, never before the installer.
            if ($upgradeProcess) {
              $upgradeProcess.Refresh()
              if (-not $upgradeProcess.HasExited) {
                Stop-Process -Id $upgradeProcess.Id -Force -ErrorAction SilentlyContinue
              }
            }
            $runningV1.Refresh()
            if (-not $runningV1.HasExited) {
              Stop-Process -Id $runningV1.Id -Force -ErrorAction SilentlyContinue
              $runningV1.WaitForExit(5000) | Out-Null
            }
          }
          # The downgrade must be refused and leave v2 intact.
          $p = Start-Process msiexec -ArgumentList "/i", "`"$($v1.FullName)`"", "/qn", "/norestart", "/L*v", "$root\downgrade.log" -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw 'downgrade install unexpectedly succeeded' }
          if ((Get-Content $installedResource -Raw) -ne 'msi-v2') { throw 'the refused downgrade mutated the installed payload' }
          $p = Start-Process msiexec -ArgumentList "/x", "`"$($v2.FullName)`"", "/qn", "/norestart", "/L*v", "$root\uninstall.log" -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { Get-Content "$root\uninstall.log" -Tail 40; throw "MSI uninstall failed with $($p.ExitCode)" }
          if (Test-Path $installRoot) { throw 'uninstall left the installation directory behind' }
          if ((Get-Content $userDataFile -Raw) -ne 'retain-across-installer-lifecycle') {
            throw 'MSI uninstall removed the user data root'
          }
          Remove-Item -Path $userDataRoot -Recurse -Force
      - name: Doctor flags the exact bad icon overload in a consumer fixture
        shell: pwsh
        run: |
          $smoke = Join-Path (Join-Path $env:RUNNER_TEMP 'rivet-smoke') 'Smoke'
          if (-not (Test-Path (Join-Path $smoke 'rivet.rktd'))) { throw 'smoke consumer project is missing' }
          New-Item -ItemType Directory -Force -Path (Join-Path $smoke 'windows') | Out-Null
          # The exact downstream mistake behind issue #379 (Fulcrum v0.14.1):
          # SetIcon handed an executable-path variable instead of an .ico file.
          Set-Content -Path (Join-Path $smoke 'windows\SettingsWindow.xaml.cpp') -Value "AppWindow().SetIcon(exe_path);"
          # A correct helper call in the same project must stay silent.
          Set-Content -Path (Join-Path $smoke 'windows\MainWindow.xaml.cpp') -Value "rivet::system::ApplyAppIcon(*this);"
          Set-Location $smoke
          $json = raco rivet doctor --json
          if ($LASTEXITCODE -ne 0) { throw 'doctor exited nonzero on warning-only findings' }
          $report = $json | ConvertFrom-Json
          $hits = @($report.warnings | Where-Object { $_.code -eq 'invalid-winui-window-icon-path' })
          if ($hits.Count -ne 1) { throw "expected exactly one invalid-winui-window-icon-path warning, got $($hits.Count)" }
          if ($hits[0].message -notmatch 'SettingsWindow\.xaml\.cpp') { throw 'icon warning did not name the offending file' }
          if ($hits[0].remediation -notmatch 'ApplyAppIcon') { throw 'icon warning lacks the helper remediation' }
          # Removing the offending file clears the warning again.
          Remove-Item (Join-Path $smoke 'windows\SettingsWindow.xaml.cpp')
          $clean = raco rivet doctor --json | ConvertFrom-Json
          $remaining = @($clean.warnings | Where-Object { $_.code -eq 'invalid-winui-window-icon-path' })
          if ($remaining.Count -ne 0) { throw 'icon warning persisted after removing the offending file' }
      - name: Build and verify the maintained WinUI reference app
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'examples\taskboard')
          raco rivet schema check rivet-schema.json --json
          raco rivet package
          raco rivet verify
          if (-not (Test-Path 'dist\rivet-taskboard-windows-x64\RivetHost.exe')) {
            throw 'Taskboard WinUI executable was not packaged'
          }
          if (-not (Test-Path 'dist\rivet-taskboard-windows-x64\app\assets\sample-tasks.rktd')) {
            throw 'Taskboard sample resource was not packaged'
          }
          raco rivet clean

  macos-host:
    name: macOS CLI package smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Verify default macOS DMG installation layout
        run: raco test rivet/tests/macos-installer.rkt
      - name: Check toolchain and JSON diagnostics
        shell: bash
        run: |
          set -euo pipefail
          raco rivet doctor
          report="$RUNNER_TEMP/rivet-doctor.json"
          raco rivet doctor --json > "$report"
          python3 - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)
          assert report["usable"] is True
          assert report["runtime"]["petite-boot"]
          assert report["runtime"]["racket-framework"]
          assert report["tools"]["plutil"]
          PY
      - name: Compile full schema matrix, package, verify, and clean SwiftUI app
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          cp "$GITHUB_WORKSPACE/rivet/tests/fixtures/schema-matrix-backend.rkt" app/backend.rkt
          mkdir -p assets/nested
          printf %s packaged-resource > assets/nested/product.txt
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace('(resources . ())', '(resources . ("assets"))').replace('(macos-min-version . "14.0")', '(macos-min-version . "14.1")')
          if updated == original:
              raise SystemExit("failed to customize macos-min-version smoke value")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet schema --output rivet-schema.json
          raco rivet schema check rivet-schema.json --json
          raco rivet build
          raco rivet package
          raco rivet verify
          test -x dist/Smoke.app/Contents/MacOS/Smoke
          test "$(cat dist/Smoke.app/Contents/Resources/app/assets/nested/product.txt)" = packaged-resource
          codesign --verify --deep --strict dist/Smoke.app
          test "$(plutil -extract LSMinimumSystemVersion raw -o - dist/Smoke.app/Contents/Info.plist)" = "14.1"
          # Hardened-runtime qualification of the declared entitlement set
          # (issue #358): re-sign the packaged app with the dev overlay
          # (declared keys plus the ad-hoc library-validation exemption),
          # confirm the effective signature matches, and re-run the packaged
          # launch smoke under the hardened signature.
          raco rivet entitlements --dev-overlay --plist > "$root/dev-overlay.plist"
          inner="$(find dist/Smoke.app/Contents/Frameworks/Racket.framework/Versions -name Racket -type f | head -n 1)"
          codesign --force --sign - --options runtime "$inner"
          codesign --force --sign - --options runtime dist/Smoke.app/Contents/Frameworks/Racket.framework
          codesign --force --sign - --options runtime --entitlements "$root/dev-overlay.plist" dist/Smoke.app
          codesign --verify --strict dist/Smoke.app
          raco rivet entitlements --check-overlay dist/Smoke.app
          raco rivet verify
          # Exercise the bundle scanner on a real packaged macOS host.
          # Code 2 is missing Store/privacy evidence, not an accepted release.
          preflight="$RUNNER_TEMP/rivet-apple-preflight.json"
          if raco rivet apple-review --channel developer-id --app dist/Smoke.app --json > "$preflight"; then
            :
          else
            result=$?
            if [ "$result" -ne 2 ]; then
              cat "$preflight"
              exit "$result"
            fi
          fi
          python3 - "$preflight" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)
          assert result["schema"] == "rivet.apple-review-preflight.v1"
          assert not result["blockers"]
          assert result["status"] in ("needs-evidence", "automated-checks-passed")
          assert result["manual_review"], "manual review must not disappear"
          PY
          raco rivet clean
          test ! -e .rivet
          test ! -e build
          test ! -e dist
          test -f app/backend.rkt
      - name: Build and verify the maintained SwiftUI reference app
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/examples/taskboard"
          raco rivet schema check rivet-schema.json --json
          raco rivet package
          raco rivet verify
          test -x "dist/rivet-taskboard.app/Contents/MacOS/rivet-taskboard"
          test -f "dist/rivet-taskboard.app/Contents/Resources/app/assets/sample-tasks.rktd"
          codesign --verify --deep --strict "dist/rivet-taskboard.app"
          raco rivet clean
